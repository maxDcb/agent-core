name: quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check agent_core tests examples
      - name: Mypy
        run: python -m mypy agent_core

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with branch coverage
        run: python -m pytest --cov=agent_core --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  windows-resilience:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run filesystem, policy, and resume tests
        run: >-
          python -m pytest
          tests/test_session_repo.py
          tests/test_policy_engine.py
          tests/test_pending_resume_flow.py
          tests/test_resilience.py

  package:
    runs-on: ubuntu-latest
    needs: [static-analysis, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/agent-core-wheel
          /tmp/agent-core-wheel/bin/python -m pip install dist/*.whl
          /tmp/agent-core-wheel/bin/python -m pip check
          /tmp/agent-core-wheel/bin/python -c "import agent_core; print(agent_core.__version__)"
