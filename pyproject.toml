[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.4.0"
description = "Generic LLM orchestration runtime for tool-using AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Agent Core Contributors"}
]
keywords = ["agent", "llm", "tools", "orchestration", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.111.0",
    "jsonschema[format]>=4.23.0,<5",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-openai>=1.6.0,<2.0.0",
    "langsmith>=0.11.0,<1.0.0",
    "openai>=2.45.0,<4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "hypothesis>=6.100.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.5.0",
    "types-jsonschema>=4.23.0",
]

[project.urls]
Repository = "https://github.com/maxDcb/agent-core"
Documentation = "https://github.com/maxDcb/agent-core#readme"
Issues = "https://github.com/maxDcb/agent-core/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_core*"]

[tool.setuptools.package-data]
agent_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "chaos: deterministic fault-injection and resilience tests",
    "live_llm: paid Azure OpenAI integration tests, disabled unless explicitly enabled",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["agent_core"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
